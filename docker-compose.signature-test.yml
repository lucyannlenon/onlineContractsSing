services:
  db-test:
    image: mysql:8.0
    volumes:
      - db_data_signature_test:/var/lib/mysql
    environment:
      MYSQL_DATABASE: ctr_test
      MYSQL_USER: ctrTestUser
      MYSQL_PASSWORD: abc
      MYSQL_ROOT_PASSWORD: abc
    healthcheck:
      test: [ "CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "ctrTestUser", "-pabc" ]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - signature-test-network

  php-test:
    build:
      context: ./docker
    command: php-fpm
    working_dir: /app
    depends_on:
      db-test:
        condition: service_healthy
      webhook-test:
        condition: service_started
    env_file:
      - .env.signature-test
    volumes:
      - ./:/app
      - var_data_signature_test:/app/var
      - certs_data_signature_test:/app/config/certs
      - ./bin/console:/usr/bin/app-console
    networks:
      signature-test-network:
        aliases:
          - php
          - contrato-online-php
    healthcheck:
      test: [ "CMD-SHELL", "php -r 'echo 1;' > /dev/null 2>&1" ]
      interval: 5s
      timeout: 5s
      retries: 30

  nginx-test:
    image: nginx:stable-alpine
    depends_on:
      php-test:
        condition: service_healthy
    ports:
      - '127.0.0.1:9005:80'
    volumes:
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      - ./:/app:ro
    networks:
      - signature-test-network

  webhook-test:
    build:
      context: ./docker
    working_dir: /app
    env_file:
      - .env.signature-test
    volumes:
      - ./:/app
    command: php -S 0.0.0.0:8080 tests/local-webhook.php
    networks:
      - signature-test-network

volumes:
  db_data_signature_test:
  var_data_signature_test:
  certs_data_signature_test:

networks:
  signature-test-network:
    driver: bridge
